
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEATLAB — DJ Studio</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="studio">

    <aside class="sidebar">
        <div class="logo">
            <span>B</span>
            <h2>BEATLAB</h2>
        </div>

        <p class="menu-title">STUDIO</p>

        <nav class="navigation">
            <a href="#" class="nav-link active">◈ Studio</a>
            <a href="#sequencer" class="nav-link">▦ Beat Maker</a>
            <a href="#pads" class="nav-link">♫ Sound Pads</a>
            <a href="#mixer" class="nav-link">◉ Mixer</a>
        </nav>

        <div class="sidebar-bottom">
            <p>BEATLAB STUDIO</p>
            <span>Version 1.0</span>
        </div>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <div>
                <h1>Music Studio</h1>
                <p>Create your own sound.</p>
            </div>

            <div class="topbar-actions">
                <span class="status">● SYSTEM READY</span>
                <button class="export-btn" id="exportBtn">Export Audio</button>
            </div>
        </header>

        <section class="project-info">
            <div>
                <span class="section-label">CURRENT PROJECT</span>
                <h2>Untitled Project</h2>
            </div>

            <div class="bpm-control">
                <label for="bpm">BPM</label>
                <input type="number" id="bpm" value="120" min="40" max="240">
            </div>
        </section>

        <section class="panel drum-panel" id="sequencer">
            <div class="panel-header">
                <div>
                    <span class="section-label">SEQUENCER</span>
                    <h2>Drum Machine</h2>
                </div>

                <div class="transport">
                    <button id="playBtn">▶ PLAY</button>
                    <button id="stopBtn">■ STOP</button>
                </div>
            </div>

            <div class="sequencer">
                <div class="sequence-row">
                    <span class="sound-name">KICK</span>
                    <div class="steps" data-sound="kick"></div>
                </div>

                <div class="sequence-row">
                    <span class="sound-name">SNARE</span>
                    <div class="steps" data-sound="snare"></div>
                </div>

                <div class="sequence-row">
                    <span class="sound-name">HI-HAT</span>
                    <div class="steps" data-sound="hihat"></div>
                </div>

                <div class="sequence-row">
                    <span class="sound-name">CLAP</span>
                    <div class="steps" data-sound="clap"></div>
                </div>
            </div>
        </section>

        <section class="panel" id="pads">
            <div class="panel-header">
                <div>
                    <span class="section-label">SOUND DESIGN</span>
                    <h2>Sound Pads</h2>
                </div>
            </div>

            <div class="sound-pads">
                <button class="sound-pad" data-pad="kick"><span>01</span>KICK</button>
                <button class="sound-pad" data-pad="snare"><span>02</span>SNARE</button>
                <button class="sound-pad" data-pad="hihat"><span>03</span>HI-HAT</button>
                <button class="sound-pad" data-pad="clap"><span>04</span>CLAP</button>
                <button class="sound-pad" data-pad="bass"><span>05</span>BASS</button>
                <button class="sound-pad" data-pad="synth"><span>06</span>SYNTH</button>
                <button class="sound-pad" data-pad="laser"><span>07</span>LASER</button>
                <button class="sound-pad" data-pad="noise"><span>08</span>NOISE</button>
            </div>
        </section>

        <section class="panel mixer-panel" id="mixer">
            <div class="panel-header">
                <div>
                    <span class="section-label">AUDIO CONTROL</span>
                    <h2>Master Mixer</h2>
                </div>
            </div>

            <div class="mixer-controls">
                <div class="mixer-channel">
                    <label for="masterVolume">MASTER</label>
                    <input type="range" id="masterVolume" min="0" max="100" value="70">
                    <span id="volumeValue">70%</span>
                </div>

                <div class="mixer-channel">
                    <label for="bassVolume">BASS</label>
                    <input type="range" id="bassVolume" min="0" max="100" value="70">
                </div>

                <div class="mixer-channel">
                    <label for="synthVolume">SYNTH</label>
                    <input type="range" id="synthVolume" min="0" max="100" value="70">
                </div>
            </div>
        </section>

    </main>
</div>

<script src="js/audio.js"></script>
<script src="js/drums.js"></script>
<script src="js/mixer.js"></script>
<script src="js/app.js"></script>

</body>
</html>
