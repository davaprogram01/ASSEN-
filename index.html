<!DOCTYPE html>
<html lang="ru">
<head>

  <title>Polaroid Галерея</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="gallery">
    <div class="polaroid" style="--angle: -5deg;">
      <img src="blob:https://web.whatsapp.com/976cdae5-d7c6-48d2-ac0b-6185970f5bdc" alt="Photo 1">
      <div class="caption">Момент #1</div>
    </div>
    <div class="polaroid" style="--angle: 3deg;">
      <img src="photo2.jpg" alt="Photo 2">
      <div class="caption">Момент #2</div>
    </div>
    <div class="polaroid" style="--angle: -7deg;">
      <img src="photo3.jpg" alt="Photo 3">
      <div class="caption">Момент #3</div>
    </div>
    <div class="polaroid" style="--angle: 4deg;">
      <img src="photo4.jpg" alt="Photo 4">
      <div class="caption">Момент #4</div>
    </div>
  </div>

</body>
</html>
